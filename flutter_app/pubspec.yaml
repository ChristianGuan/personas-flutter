name: personas_flutter
description: Búsqueda local de fotografías por persona para Android e iOS.
publish_to: none
version: 0.9.2+15
environment:
  sdk: '>=3.11.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  package_info_plus: ^10.2.2
  sqflite: ^2.4.5
  flutter_secure_storage: ^11.2.0
  connectivity_plus: ^7.3.2
  workmanager: ^0.10.10
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  sqflite_common_ffi: ^2.4.0
flutter:
  uses-material-design: true
  assets:
    - assets/brand/home-reference.png
    - assets/brand/lamp-gold-transparent.png
    - assets/brand/how-it-works-reference.png
